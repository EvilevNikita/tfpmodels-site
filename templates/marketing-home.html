<!DOCTYPE html>
<html lang="$code">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>$title</title>
  <meta name="description" content="$description">
  $seo_links
  <link rel="stylesheet" href="/styles.css?v=20260924-all">
  <link rel="icon" type="image/png" sizes="256x256" href="/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/analytics.css">
  <script src="/languages.js?v=20260924-all"></script>
  <script defer src="/analytics.js?v=20260924-all"></script>
</head>
<body class="home-page">
  <div class="site-shell">
    <header class="hero">
      <div class="hero__topbar">
        <div class="hero__identity">
          <div class="hero__badge">TFP Models</div>
          $picker
        </div>
        <nav class="hero__downloads" aria-label="$heading">
          <a class="button button--download" href="https://apps.apple.com/app/tfp-models/id6766621647">
            <svg class="download-icon" width="26" height="26" viewBox="0 0 32 32" fill="none" aria-hidden="true" focusable="false">
              <rect width="32" height="32" rx="7" fill="#087CFA"/>
              <path d="m13 7 8 14M19 7l-8 14M7 21h13M22 21h3M9.5 23.5 8 26M21 21l3 5" stroke="white" stroke-width="2.7" stroke-linecap="round"/>
            </svg>
            <span>$iphone</span>
          </a>
          <a class="button button--download" href="https://play.google.com/store/apps/details?id=tfpmodels.app">
            <svg class="download-icon" width="26" height="26" viewBox="0 0 32 32" fill="none" aria-hidden="true" focusable="false">
              <path d="M5 3.5 18 16 5 28.5Z" fill="#4285F4"/>
              <path d="m5 3.5 16.5 9L18 16Z" fill="#34A853"/>
              <path d="m18 16 3.5 3.5L5 28.5Z" fill="#EA4335"/>
              <path d="m21.5 12.5 5 2.7a.9.9 0 0 1 0 1.6l-5 2.7L18 16Z" fill="#FBBC04"/>
            </svg>
            <span>$android</span>
          </a>
        </nav>
      </div>
      <h1>$heading</h1>
      <p class="hero__text">$intro</p>
    </header>
    <main>
      <div class="content-grid">
        <section class="card">
          <h2>$iphone</h2>
          <p>$iphone_text</p>
          <a class="button button--download" href="https://apps.apple.com/app/tfp-models/id6766621647">$download</a>
        </section>
        <section class="card">
          <h2>$android</h2>
          <p>$android_intro</p>
          <a class="button button--download" href="https://play.google.com/store/apps/details?id=tfpmodels.app">$install</a>
        </section>
        <section class="card">
          <h2>$start_title</h2>
          <p>$start_text</p>
          <ul class="feature-list">
            <li>$feature_0</li>
            <li>$feature_1</li>
            <li>$feature_2</li>
          </ul>
        </section>
      </div>
      <section class="card home-about" aria-labelledby="download-links">
        <h2 id="download-links">$links_label</h2>
        <ul class="link-list">
          <li><a href="/privacy.html">$privacy</a></li>
          <li><a href="/support.html">$support</a></li>
          <li><a href="/community-guidelines.html">$community</a></li>
          <li><a href="mailto:support@tfpmodels.org">support@tfpmodels.org</a></li>
        </ul>
      </section>
    </main>
  </div>
</body>
</html>
